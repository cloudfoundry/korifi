version: "2"

run:
  modules-download-mode: mod

linters:
  enable:
    - dupl
    - ginkgolinter
  disable:
    - staticcheck # we run this separately
  settings:
    govet:
      # report about shadowed variables
      enable:
        - shadow
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
      # False positives comparing cfserviceinstance and cfservicebinding reconcile loops.
      - path: service\w+_controller\.go
        linters:
          - dupl
      # False positives comparing validating webhooks for cforg and cfapp.
      - path: workloads/cf\w+_validation\.go
        linters:
          - dupl
    paths:
      - vendor
      - pkg
      - third_party$
      - builtin$
      - examples$

issues:
  # 0 disables the limit (v1 max-per-linter / max-same).
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
